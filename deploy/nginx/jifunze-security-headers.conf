# Security headers for responses Nginx serves itself (the static front end). Responses that come
# from the app already carry the same headers, so this file is NOT included in the proxy
# locations (it would duplicate them). The CSP must equal app/security.py CSP; a test checks.
# Install to /etc/nginx/snippets/jifunze-security-headers.conf.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
