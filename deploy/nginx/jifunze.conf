# Nginx in front of the app. Install to /etc/nginx/conf.d/jifunze.conf (http context) and remove
# the default site. Traffic path: Cloudflare Tunnel -> 127.0.0.1:8080 (here) -> Unix socket -> app.
# Nginx serves the static front end itself and proxies /api/ and /healthz to Uvicorn.

# Per-client limits. $binary_remote_addr is the real client address (see set_real_ip_from below).
limit_req_zone $binary_remote_addr zone=jifunze_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=jifunze_api:2m rate=20r/s;

upstream jifunze_app {
    server unix:/run/jifunze/app.sock;
}

server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;

    # cloudflared connects from 127.0.0.1 and passes the visitor's address in CF-Connecting-IP.
    # Believe that header only from 127.0.0.1, so nobody else can choose their own address.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Size and slow-client limits (Uvicorn has no read timeout of its own). The body cap matches
    # MAX_BODY_BYTES in .env (65536).
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_req_status 429;

    root /srv/jifunze/current/web;

    # ---- app: /healthz and /api/ -------------------------------------------------------------
    # The app adds its own security headers to these responses.
    location = /healthz {
        include /etc/nginx/snippets/jifunze-proxy.conf;
        error_page 502 503 504 = @app_down;
    }

    # Login: 5 a minute per address, a burst of 5 on top. The app also throttles per account.
    location = /api/login {
        limit_req zone=jifunze_login burst=5 nodelay;
        include /etc/nginx/snippets/jifunze-proxy.conf;
        error_page 502 503 504 = @app_down;
    }

    location ^~ /api/ {
        limit_req zone=jifunze_api burst=40 nodelay;
        include /etc/nginx/snippets/jifunze-proxy.conf;
        error_page 502 503 504 = @app_down;
    }

    location @app_down {
        include /etc/nginx/snippets/jifunze-security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 503 '{"detail":"the app is restarting, try again in a moment"}';
    }

    # ---- static front end --------------------------------------------------------------------
    # The service worker must always be re-fetched, or an update could never reach installed apps.
    location = /sw.js {
        include /etc/nginx/snippets/jifunze-security-headers.conf;
        expires -1;
        try_files $uri =404;
    }

    # Fonts and icons never change in place: cache for 30 days.
    location ~* \.(woff2|png|svg)$ {
        include /etc/nginx/snippets/jifunze-security-headers.conf;
        expires 30d;
        try_files $uri =404;
    }

    # Everything else (HTML, JS, CSS, manifest) is revalidated on each load: "no-cache" still
    # allows a fast 304 through the ETag.
    location / {
        include /etc/nginx/snippets/jifunze-security-headers.conf;
        expires -1;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ---- maintenance page while the app is down (restart, deploy, crash) ----------------------
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        internal;
        include /etc/nginx/snippets/jifunze-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
