# Shared proxy settings for the app locations. Install to /etc/nginx/snippets/jifunze-proxy.conf.
proxy_pass http://jifunze_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Keep the browser's Host so the app's Origin check (Origin host == Host) works.
proxy_set_header Host $http_host;
# Always overwrite this header with the address Nginx resolved: the app believes it whenever the
# connection comes from the local machine, so a client-supplied value must never get through.
proxy_set_header CF-Connecting-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;
