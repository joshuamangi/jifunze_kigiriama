---
# The machine side of the app: units, timers and the environment file. The code itself arrives
# through deploy/deploy.sh (GitHub Actions or by hand), never through this playbook.
- name: Read which services are running
  ansible.builtin.service_facts:

- name: Install the systemd units and timers
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/systemd/"
    dest: /etc/systemd/system/
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Mail settings must be complete when the backend is smtp
  ansible.builtin.assert:
    that:
      - alert_email | length > 0
      - smtp_host | length > 0
      - smtp_user | length > 0
      - smtp_from | length > 0
      - smtp_password | length > 0
    fail_msg: >-
      reminder_backend is smtp, so alert_email, smtp_user, smtp_from and smtp_password must be set in
      the encrypted secrets file (sops secrets.sops.yaml) and smtp_host in group_vars. See
      docs/GO_LIVE.md section 7, or set reminder_backend to console to switch mail off.
    quiet: true
  when: reminder_backend == 'smtp'

- name: Write the environment file
  ansible.builtin.template:
    src: jifunze.env.j2
    dest: "{{ env_dir }}/jifunze.env"
    owner: root
    group: "{{ service_user }}"
    mode: "0640"
  no_log: true
  notify: Restart the app if it is running

- name: Pick up new units now, before enabling them
  ansible.builtin.meta: flush_handlers

- name: Check whether a release has been deployed
  ansible.builtin.stat:
    path: "{{ base_dir }}/current"
  register: jifunze_app_current

- name: Enable the app (it starts at the first deploy)
  ansible.builtin.systemd:
    name: jifunze.service
    enabled: true

- name: Enable the timers, and start them once there is a release to run
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: "{{ 'started' if jifunze_app_current.stat.exists else omit }}"
  loop:
    - jifunze-reminders.timer
    - jifunze-backup.timer
    - jifunze-optimize.timer
