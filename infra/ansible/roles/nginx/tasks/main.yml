---
- name: Snippets directory
  ansible.builtin.file:
    path: /etc/nginx/snippets
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the proxy and security-header snippets
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/nginx/{{ item }}"
    dest: "/etc/nginx/snippets/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - jifunze-proxy.conf
    - jifunze-security-headers.conf
  notify: Reload nginx

- name: Install the site
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/nginx/jifunze.conf"
    dest: /etc/nginx/conf.d/jifunze.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Check the configuration before anything reloads
  ansible.builtin.command: nginx -t
  changed_when: false
  check_mode: false

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
