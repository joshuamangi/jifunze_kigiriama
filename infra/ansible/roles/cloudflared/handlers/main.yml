---
- name: Reload systemd for cloudflared
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart cloudflared
  ansible.builtin.systemd:
    name: cloudflared.service
    state: restarted
  # In --check mode the unit is not really installed yet, so systemd cannot find it.
  ignore_errors: "{{ ansible_check_mode }}"
