---
# Template for the encrypted secrets file. Do not put real values in this file.
#   cp secrets.example.yaml secrets.sops.yaml   (after filling .sops.yaml with your public key)
#   sops --encrypt --in-place secrets.sops.yaml
#   sops secrets.sops.yaml                      (edit later; it decrypts in your editor)
# python3 -c "import secrets; print(secrets.token_urlsafe(48))"
session_secret: CHANGE-ME
# Failure alerts and reminder mail (docs/GO_LIVE.md section 7). Gmail: the address, and an app password
# made in the Google account (Security > 2-Step Verification > App passwords), 16 letters, no spaces.
alert_email: CHANGE-ME@example.com
smtp_user: CHANGE-ME@example.com
smtp_from: CHANGE-ME@example.com
smtp_password: CHANGE-ME
# The whole contents of ~/.cloudflared/<tunnel-id>.json, as a block string.
cloudflared_credentials_json: |
  {"AccountTag":"CHANGE-ME","TunnelSecret":"CHANGE-ME","TunnelID":"CHANGE-ME"}
