# Tests on every pull request and every push to main. Also called by release.yml, so a tag can
# only be released after the same checks pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EMBEDDER: fake
    steps:
      # Third-party actions are pinned to full commit SHAs (looked up with the GitHub API).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install (same layout as `make install`)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: The hash-pinned lock file the Pi installs from still installs
        run: |
          python -m venv "$RUNNER_TEMP/lockcheck"
          "$RUNNER_TEMP/lockcheck/bin/pip" install --quiet --require-hashes --no-deps -r requirements.lock
      - name: Lint (ruff, ruff format, shellcheck)
        run: make lint
      - name: Tests (includes the migration tests)
        run: make test
      - name: Front-end size budget
        run: make check-web-size
      - name: Dependency audit (pip-audit)
        run: make audit-deps
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-gitleaks-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Secret scan (gitleaks)
        run: make audit-secrets
