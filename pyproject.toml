[project]
name = "jifunze-kigiriama"
version = "0.1.0"
description = "Self-hosted PWA for learning Kigiriama"
requires-python = ">=3.11"
dependencies = [
    "fastapi",  # web framework
    "uvicorn",  # ASGI server; plain build, no [standard] extras, to keep the Pi footprint small
    "argon2-cffi",  # argon2id password hashing; ships aarch64 wheels
    "onnxruntime",  # runs the MiniLM embedding model on the CPU; aarch64 wheel, no compiling on the Pi
    "tokenizers",  # turns text into the token ids the model expects; aarch64 wheel
    "numpy",  # array maths for pooling; onnxruntime needs it anyway
    "sqlite-vec",  # vec0 vector tables for semantic search; ships aarch64 wheels
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",  # required by FastAPI's TestClient
    "ruff==0.16.10",  # same version as the pre-commit hook, so formatting agrees
    "pre-commit",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# SQL here is assembled only from code constants (VISIBLE, NOW) and a column whitelist
# (PATCHABLE); all user values are bound parameters.
"app/entries.py" = ["S608"]
"app/embeddings/worker.py" = ["S608"]  # NOW is a constant SQL expression, no user text
"app/services/learn.py" = ["S608"]  # APPROVED and NOW are constants; user values are bound
"app/search.py" = ["S608"]  # VISIBLE and placeholder lists are built from constants
