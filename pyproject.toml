[project]
name = "jifunze-kigiriama"
version = "0.1.0"
description = "Self-hosted PWA for learning Kigiriama"
requires-python = ">=3.11"
dependencies = [
    "fastapi",  # web framework
    "uvicorn",  # ASGI server; plain build, no [standard] extras, to keep the Pi footprint small
    "sqlite-vec",  # vec0 vector tables for semantic search; ships aarch64 wheels
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",  # required by FastAPI's TestClient
    "ruff",
    "pre-commit",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
